<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Star Catcher - Daily Cool Game #1</title>
<style>
body { margin:0; background:#0a0a1a; color:#fff; font-family: 'Segoe UI', sans-serif; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; overflow:hidden; }
canvas { border: 2px solid #4fc3f7; border-radius:12px; box-shadow:0 0 30px #4fc3f7; background:#000; }
#ui { position:absolute; top:20px; left:20px; font-size:24px; text-shadow:0 0 10px #fff; }
#score { color:#ffeb3b; }
#best { color:#4caf50; font-size:18px; }
#message { position:absolute; top:50%; left:50%; transform:translate(-50%,-50%); font-size:48px; text-align:center; text-shadow:0 0 20px #ff4081; pointer-events:none; }
button { margin-top:20px; padding:12px 24px; font-size:20px; background:#ff4081; color:white; border:none; border-radius:8px; cursor:pointer; box-shadow:0 0 15px #ff4081; }
button:hover { background:#f50057; }
</style>
</head>
<body>
<div id="ui">Score: <span id="score">0</span> | Best: <span id="best">0</span></div>
<div id="message">Click to Start!</div>
<canvas id="game" width="480" height="640"></canvas>
<button onclick="restart()">Restart</button>

<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const scoreEl = document.getElementById('score');
const bestEl = document.getElementById('best');
const msgEl = document.getElementById('message');

let score = 0;
let best = localStorage.getItem('starCatcherBest') || 0;
bestEl.textContent = best;
let gameRunning = false;
let player = { x: 240, y: 580, w: 60, h: 20, speed: 8 };
let stars = [];
let particles = [];
let bombs = [];
let frame = 0;
let spawnRate = 60;

function resize() {
  // Keep fixed for simplicity
}
window.addEventListener('resize', resize);

canvas.addEventListener('mousemove', e => {
  if (!gameRunning) return;
  const rect = canvas.getBoundingClientRect();
  player.x = e.clientX - rect.left - player.w/2;
  player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));
});

canvas.addEventListener('touchmove', e => {
  e.preventDefault();
  if (!gameRunning) return;
  const rect = canvas.getBoundingClientRect();
  player.x = e.touches[0].clientX - rect.left - player.w/2;
  player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));
}, {passive:false});

canvas.addEventListener('click', start);

function start() {
  if (gameRunning) return;
  gameRunning = true;
  msgEl.style.display = 'none';
  score = 0;
  stars = [];
  bombs = [];
  particles = [];
  frame = 0;
  spawnRate = 60;
  loop();
}

function restart() {
  gameRunning = false;
  msgEl.style.display = 'block';
  msgEl.textContent = 'Click to Start!';
  scoreEl.textContent = 0;
  ctx.clearRect(0,0,canvas.width,canvas.height);
}

function spawn() {
  if (frame % spawnRate === 0) {
    if (Math.random() < 0.8) {
      stars.push({
        x: Math.random() * (canvas.width - 30),
        y: -30,
        size: 20 + Math.random()*15,
        speed: 2 + score*0.05 + Math.random(),
        color: `hsl(${Math.random()*360}, 100%, 60%)`
      });
    } else {
      bombs.push({
        x: Math.random() * (canvas.width - 30),
        y: -30,
        size: 25,
        speed: 3 + score*0.04,
        color: '#ff1744'
      });
    }
  }
  if (frame % 300 === 0 && spawnRate > 20) spawnRate -= 5;
}

function update() {
  frame++;
  spawn();

  // Stars
  for (let i = stars.length-1; i>=0; i--) {
    const s = stars[i];
    s.y += s.speed;
    if (s.y > canvas.height) stars.splice(i,1);
    // Collision
    if (s.x < player.x + player.w && s.x + s.size > player.x &&
        s.y < player.y + player.h && s.y + s.size > player.y) {
      score++;
      scoreEl.textContent = score;
      if (score > best) {
        best = score;
        bestEl.textContent = best;
        localStorage.setItem('starCatcherBest', best);
      }
      // Particles
      for (let p=0; p<15; p++) {
        particles.push({
          x: s.x + s.size/2,
          y: s.y + s.size/2,
          vx: (Math.random()-0.5)*8,
          vy: (Math.random()-0.5)*8,
          life: 30,
          color: s.color
        });
      }
      stars.splice(i,1);
    }
  }

  // Bombs
  for (let i = bombs.length-1; i>=0; i--) {
    const b = bombs[i];
    b.y += b.speed;
    if (b.y > canvas.height) bombs.splice(i,1);
    if (b.x < player.x + player.w && b.x + b.size > player.x &&
        b.y < player.y + player.h && b.y + b.size > player.y) {
      gameOver();
      return;
    }
  }

  // Particles
  for (let i = particles.length-1; i>=0; i--) {
    const p = particles[i];
    p.x += p.vx;
    p.y += p.vy;
    p.life--;
    if (p.life <= 0) particles.splice(i,1);
  }
}

function draw() {
  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0,0,canvas.width,canvas.height);

  // Player
  ctx.fillStyle = '#00e5ff';
  ctx.shadowBlur = 15;
  ctx.shadowColor = '#00e5ff';
  ctx.fillRect(player.x, player.y, player.w, player.h);
  ctx.shadowBlur = 0;

  // Stars
  stars.forEach(s => {
    ctx.fillStyle = s.color;
    ctx.shadowBlur = 10;
    ctx.shadowColor = s.color;
    ctx.beginPath();
    ctx.arc(s.x + s.size/2, s.y + s.size/2, s.size/2, 0, Math.PI*2);
    ctx.fill();
    // Star shape
    ctx.beginPath();
    for (let i=0; i<5; i++) {
      const ang = (i * 4 * Math.PI / 5) - Math.PI/2;
      const r = i%2===0 ? s.size/2 : s.size/4;
      ctx.lineTo(s.x + s.size/2 + Math.cos(ang)*r, s.y + s.size/2 + Math.sin(ang)*r);
    }
    ctx.closePath();
    ctx.fillStyle = '#fff';
    ctx.fill();
  });
  ctx.shadowBlur = 0;

  // Bombs
  bombs.forEach(b => {
    ctx.fillStyle = b.color;
    ctx.shadowBlur = 15;
    ctx.shadowColor = b.color;
    ctx.beginPath();
    ctx.arc(b.x + b.size/2, b.y + b.size/2, b.size/2, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#000';
    ctx.font = '16px sans-serif';
    ctx.fillText('💣', b.x + 4, b.y + 18);
  });
  ctx.shadowBlur = 0;

  // Particles
  particles.forEach(p => {
    ctx.globalAlpha = p.life / 30;
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 3, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
  });
}

function gameOver() {
  gameRunning = false;
  msgEl.style.display = 'block';
  msgEl.innerHTML = `Game Over!<br>Score: ${score}`;
}

function loop() {
  if (!gameRunning) return;
  update();
  draw();
  requestAnimationFrame(loop);
}

// Initial draw
draw();
</script>
</body>
</html>
